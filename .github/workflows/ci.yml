name: CI / Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    name: Build Jekyll site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: frontend
      - run: JEKYLL_ENV=production bundle exec jekyll build --strict_front_matter
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: frontend/_site
          retention-days: 7

  docker:
    name: Build, smoke-test & push image
    needs: [test, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        env:
          FLAGSHIP_API_TOKEN: ${{ secrets.FLAGSHIP_API_TOKEN }}
        run: |
          docker run -d --name app -p 8000:8000 -e FLAGSHIP_API_TOKEN app:ci
          for i in $(seq 1 20); do
            curl -fs http://localhost:8000/health && break
            if [ "$i" = 20 ]; then docker logs app; exit 1; fi
            sleep 1
          done
          echo; echo "Checking the Jekyll frontend is served..."
          curl -fs http://localhost:8000/ | grep -q 'id="note-form"'
          curl -fs http://localhost:8000/about/ | grep -q 'About this app'
          curl -fs http://localhost:8000/assets/css/main.css | grep -q 'hero'
          curl -fs http://localhost:8000/assets/js/app.js | grep -q '/api/notes'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/no-such-page)" = 404
          echo "Frontend OK"

      - name: Check live Cloudflare Flagship flags
        env:
          FLAGSHIP_API_TOKEN: ${{ secrets.FLAGSHIP_API_TOKEN }}
        run: |
          if [ -z "$FLAGSHIP_API_TOKEN" ]; then
            echo "::notice::FLAGSHIP_API_TOKEN secret not set - skipping the live Flagship check."
            exit 0
          fi
          curl -fs http://localhost:8000/api/flags -H 'X-User-Id: ci-check' -H 'X-User-Plan: pro' | tee flags.json
          echo
          # The default limit is 500; only Flagship's pro-plan rule gives 2000.
          python3 -c "import json,sys; f=json.load(open('flags.json')); assert f['provider']=='flagship', f; assert f['flags']['max-note-length']==2000, 'Flagship not answering: '+str(f)"
          echo "Live Flagship flags OK"


      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  linearb-deployment:
    name: Report deployment to LinearB
    needs: docker
    # Every image published from main counts as a deployment for DORA metrics
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: POST deployment to LinearB API
        env:
          LINEARB_API_TOKEN: ${{ secrets.LINEARB_API_TOKEN }}
        run: |
          if [ -z "$LINEARB_API_TOKEN" ]; then
            echo "::warning::LINEARB_API_TOKEN secret not set - skipping LinearB deployment report."
            exit 0
          fi
          body=$(jq -n \
            --arg repo "${{ github.server_url }}/${{ github.repository }}.git" \
            --arg ref  "${{ github.sha }}" \
            --arg ts   "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{repo_url: $repo, ref_name: $ref, timestamp: $ts}')
          echo "Reporting: $body"
          curl -sS --fail-with-body -X POST "https://public-api.linearb.io/api/v1/deployments" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $LINEARB_API_TOKEN" \
            -d "$body"
