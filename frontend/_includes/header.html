<!-- Site-wide notice, filled from the site-banner feature flag (see assets/js/app.js) -->
<div id="site-banner" class="site-banner" role="status" hidden>
  <div class="container banner-inner">
    <span id="site-banner-text"></span>
    <button type="button" id="site-banner-close" class="banner-close" aria-label="Dismiss notice">×</button>
  </div>
</div>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.settings.title | escape }}</a>
    <nav>
      {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
