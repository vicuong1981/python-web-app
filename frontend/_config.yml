# Jekyll site for the My Notes Application frontend.
# Built to frontend/_site and served by FastAPI (see app/main.py).
# Editable content (title, text, colours, built-in ad) lives in _data/ and is
# edited through Pages CMS (see /.pages.yml).
version: 0.5.0

nav:
  - title: Notes
    url: /
  - title: About
    url: /about/
  - title: API docs
    url: /docs


sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
