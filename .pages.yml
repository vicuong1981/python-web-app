# Pages CMS (https://pagescms.org): a simple editor for this site's text,
# colours and built-in ad. Sign in at https://app.pagescms.org with GitHub and
# open this repo. Saving commits to main, which redeploys the site.
content:
  - name: settings
    label: Site settings
    description: Site name, tagline, footer and the built-in sidebar banner.
    type: file
    path: frontend/_data/settings.yml
    format: yaml
    fields:
      - name: title
        label: Site name
        type: string
        required: true
      - name: description
        label: Tagline
        description: Shown under the site name and in search results.
        type: text
      - name: footer_text
        label: Footer text
        type: string
      - name: house_ad
        label: Built-in sidebar banner
        description: Shown in the right-hand column when the sidebar-ad flag is "house".
        type: object
        fields:
          - name: title
            label: Heading
            type: string
          - name: text
            label: Text
            type: text
          - name: cta
            label: Button label
            type: string
          - name: url
            label: Button link
            type: string
            pattern:
              regex: "^https?://"
              message: Must start with http:// or https://

  - name: homepage
    label: Homepage text
    description: Headings and helper text on the Notes page.
    type: file
    path: frontend/_data/homepage.yml
    format: yaml
    fields:
      - { name: hero_title, label: New-homepage banner heading, description: Only shown when the new-homepage flag is on., type: string }
      - { name: hero_text, label: New-homepage banner text, type: text }
      - { name: add_note_heading, label: '"Add a note" heading', type: string }
      - { name: note_placeholder, label: Note box placeholder, type: string }
      - { name: tags_hint, label: Tags hint, type: string }
      - { name: categories_heading, label: Categories heading, type: string }
      - { name: notes_heading, label: Notes list heading, type: string }
      - { name: empty_notes, label: Message when there are no notes, type: string }
      - { name: share_hint, label: Share dialog hint, type: text }

  - name: theme
    label: Colours
    description: Use 6-digit hex codes, for example #4f46e5.
    type: file
    path: frontend/_data/theme.yml
    format: yaml
    fields:
      - { name: accent, label: Main colour (buttons, links), type: string, required: true, pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "Use a 6-digit hex code like #4f46e5" } }
      - { name: accent_2, label: Second colour (banner gradient), type: string, required: true, pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "Use a 6-digit hex code like #06b6d4" } }
      - { name: text, label: Text colour, type: string, required: true, pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "Use a 6-digit hex code" } }
      - { name: muted, label: Secondary text colour, type: string, required: true, pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "Use a 6-digit hex code" } }
      - { name: background, label: Page background, type: string, required: true, pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "Use a 6-digit hex code" } }
      - { name: card, label: Card background, type: string, required: true, pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "Use a 6-digit hex code" } }
      - { name: border, label: Border colour, type: string, required: true, pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "Use a 6-digit hex code" } }
      - { name: corner_radius, label: Corner roundness (pixels), type: number, required: true, options: { min: 0, max: 24 } }

  - name: about
    label: About page
    description: The About page, written in Markdown.
    type: file
    path: frontend/about.md
    format: yaml-frontmatter
    fields:
      - { name: layout, label: Layout, type: string, hidden: true }
      - { name: permalink, label: Address, type: string, hidden: true }
      - { name: title, label: Page title, type: string, required: true }
      - { name: body, label: Page content (Markdown), type: text, options: { rows: 20 } }
