# SonarQube Cloud analysis settings (used by .github/workflows/security.yml).
# Project and organisation keys are what SonarQube Cloud creates when you import
# vicuong1981/python-web-app; override them with the SONAR_ORGANIZATION and
# SONAR_PROJECT_KEY repository variables if yours differ.
sonar.organization=vicuong1981
sonar.projectKey=vicuong1981_python-web-app
sonar.projectName=My Notes Application

sonar.sources=app,scripts,frontend/assets/js
sonar.tests=tests
sonar.exclusions=frontend/_site/**,frontend/vendor/**
sonar.python.version=3.12

# Test coverage from pytest-cov, and Bandit findings shown as external issues
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.bandit.reportPaths=bandit-report.json
